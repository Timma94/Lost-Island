<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lost Island v2</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d1512;
    color: #f2f5f3;
    font-family: Arial, sans-serif;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

#app {
    max-width: 720px;
    margin: auto;
    min-height: 100vh;
    padding: 14px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.subtitle {
    opacity: .6;
    font-size: 12px;
    margin-top: 3px;
}

.header-right {
    display: flex;
    gap: 7px;
    align-items: center;
}

.header-button {
    border: 1px solid #34473e;
    background: #17231f;
    color: white;
    padding: 8px 10px;
    border-radius: 9px;
}

.card {
    background: #16211d;
    border: 1px solid #293a33;
    border-radius: 15px;
    padding: 16px;
    margin-bottom: 12px;
}

h2,
h3 {
    margin-top: 0;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
}

.stat {
    background: #0f1814;
    border-radius: 10px;
    padding: 9px;
    text-align: center;
}

.stat-value {
    font-size: 20px;
    font-weight: bold;
}

.stat-label {
    font-size: 11px;
    opacity: .65;
    margin-top: 3px;
}

.resources {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 7px;
}

.resource {
    background: #0f1814;
    border-radius: 9px;
    padding: 9px;
}

.resource-title {
    opacity: .7;
    font-size: 12px;
}

.resource-value {
    font-weight: bold;
    font-size: 17px;
    margin-top: 2px;
}

.progress {
    height: 7px;
    background: #0c1210;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 8px;
}

.progress-bar {
    height: 100%;
    background: #d7a84d;
}

.action-list {
    display: grid;
    gap: 8px;
}

.action {
    width: 100%;
    text-align: left;
    border: 1px solid #354a41;
    background: #1a2923;
    color: white;
    border-radius: 10px;
    padding: 12px;
}

.action:hover {
    background: #24372f;
}

.action:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.action-title {
    font-weight: bold;
}

.action-description {
    opacity: .65;
    font-size: 12px;
    margin-top: 3px;
}

.location {
    display: inline-block;
    padding: 6px 8px;
    background: #101915;
    border-radius: 7px;
    margin: 3px;
    font-size: 12px;
}

.event {
    background: #1b2923;
    border: 1px solid #3a5146;
    border-radius: 13px;
    padding: 16px;
    margin-bottom: 12px;
}

.event h2 {
    margin-bottom: 8px;
}

.choice {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border-radius: 9px;
    border: 1px solid #40574c;
    background: #192821;
    color: white;
}

.choice:hover {
    background: #263b31;
}

.good {
    border-color: #42694e;
}

.bad {
    border-color: #744438;
}

.warning {
    background: #2a1d19;
}

.modal-background {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    z-index: 100;
}

.modal {
    width: 100%;
    max-width: 520px;
    max-height: 92vh;
    overflow-y: auto;
    background: #16211d;
    border: 1px solid #40554b;
    border-radius: 15px;
    padding: 18px;
}

.hidden {
    display: none !important;
}

.setting {
    display: grid;
    grid-template-columns: 1fr 100px;
    gap: 10px;
    align-items: center;
    margin: 9px 0;
}

.setting input {
    width: 100%;
    background: #0c1310;
    color: white;
    border: 1px solid #40564b;
    border-radius: 7px;
    padding: 7px;
}

.primary {
    width: 100%;
    padding: 12px;
    background: #d7a84d;
    color: #111;
    border: 0;
    border-radius: 9px;
    font-weight: bold;
    margin-top: 10px;
}

.secondary {
    width: 100%;
    padding: 11px;
    background: transparent;
    color: white;
    border: 1px solid #40564b;
    border-radius: 9px;
    margin-top: 7px;
}

.result {
    text-align: center;
}

.result-score {
    font-size: 28px;
    font-weight: bold;
    margin: 18px 0 5px;
}

.time-change {
    font-size: 25px;
    font-weight: bold;
    margin: 15px 0;
}

.small {
    font-size: 12px;
    opacity: .65;
}

hr {
    border: 0;
    border-top: 1px solid #2b3c34;
    margin: 16px 0;
}

</style>
</head>

<body>

<div id="app"></div>

<div id="settingsModal" class="modal-background hidden">

    <div class="modal">

        <h2>⚙️ Game Settings</h2>

        <p class="small">
            All time values are minutes.
            Negative values remove time.
            Positive values add time.
        </p>

        <h3>🏆 Performance</h3>

        <div class="setting">
            <label>Legendary max actions</label>
            <input id="legendaryActions" type="number">
        </div>

        <div class="setting">
            <label>Legendary reward</label>
            <input id="legendaryReward" type="number">
        </div>

        <div class="setting">
            <label>Excellent max actions</label>
            <input id="excellentActions" type="number">
        </div>

        <div class="setting">
            <label>Excellent reward</label>
            <input id="excellentReward" type="number">
        </div>

        <div class="setting">
            <label>Good max actions</label>
            <input id="goodActions" type="number">
        </div>

        <div class="setting">
            <label>Good reward</label>
            <input id="goodReward" type="number">
        </div>

        <div class="setting">
            <label>Survived max actions</label>
            <input id="survivedActions" type="number">
        </div>

        <div class="setting">
            <label>Survived reward</label>
            <input id="survivedReward" type="number">
        </div>

        <div class="setting">
            <label>Slow max actions</label>
            <input id="slowActions" type="number">
        </div>

        <div class="setting">
            <label>Slow penalty</label>
            <input id="slowPenalty" type="number">
        </div>

        <div class="setting">
            <label>Critical penalty</label>
            <input id="criticalPenalty" type="number">
        </div>

        <h3>☠️ Failure</h3>

        <div class="setting">
            <label>Death penalty</label>
            <input id="deathPenalty" type="number">
        </div>

        <div class="setting">
            <label>Extreme failure</label>
            <input id="failurePenalty" type="number">
        </div>

        <h3>🎲 Random events</h3>

        <div class="setting">
            <label>Small lucky event</label>
            <input id="luckySmall" type="number">
        </div>

        <div class="setting">
            <label>Large lucky event</label>
            <input id="luckyLarge" type="number">
        </div>

        <div class="setting">
            <label>Small setback</label>
            <input id="setbackSmall" type="number">
        </div>

        <div class="setting">
            <label>Large setback</label>
            <input id="setbackLarge" type="number">
        </div>

        <h3>📅 Game length</h3>

        <div class="setting">
            <label>Maximum days</label>
            <input id="maxDays" type="number">
        </div>

        <button class="primary" onclick="saveSettings()">
            Save settings
        </button>

        <button class="secondary" onclick="closeSettings()">
            Cancel
        </button>

    </div>

</div>

<script>

/* =========================================================
   DEFAULT SETTINGS
   CHANGE THESE VALUES TO BALANCE THE GAME
   ========================================================= */

const DEFAULT_SETTINGS = {

    legendaryActions: 20,
    legendaryReward: -60,

    excellentActions: 25,
    excellentReward: -45,

    goodActions: 30,
    goodReward: -30,

    survivedActions: 40,
    survivedReward: -10,

    slowActions: 50,
    slowPenalty: 15,

    criticalPenalty: 30,

    deathPenalty: 30,

    failurePenalty: 180,

    luckySmall: -5,
    luckyLarge: -10,

    setbackSmall: 5,
    setbackLarge: 10,

    maxDays: 14
};


/* =========================================================
   GAME STATE
   ========================================================= */

function createNewGame() {

    return {

        day: 1,

        actionsToday: 0,

        actionsUsed: 0,

        health: 100,

        food: 4,

        water: 4,

        wood: 0,

        materials: 0,

        shelter: false,

        fire: false,

        radio: false,

        battery: false,

        radioRepaired: false,

        signalTower: false,

        boat: false,

        boatRepaired: false,

        freshWater: false,

        locations: {

            jungle: false,
            cave: false,
            wreckage: false,
            radioTower: false,
            hiddenBeach: false

        },

        flags: {

            caveCache: false,
            ropeFound: false,
            boatParts: 0,
            radioParts: 0

        },

        timeChange: 0,

        status: "playing",

        result: null,

        settings: {
            ...DEFAULT_SETTINGS
        }

    };

}


let game = createNewGame();


/* =========================================================
   SAVE / LOAD
   ========================================================= */

function saveGame() {

    localStorage.setItem(
        "lostIslandV2",
        JSON.stringify(game)
    );

}


function loadGame() {

    const saved =
        localStorage.getItem("lostIslandV2");

    if (!saved) return;

    try {

        const loaded = JSON.parse(saved);

        game = {

            ...createNewGame(),

            ...loaded,

            settings: {

                ...DEFAULT_SETTINGS,

                ...(loaded.settings || {})

            }

        };

    } catch {

        game = createNewGame();

    }

}


/* =========================================================
   TIME
   ========================================================= */

function addTime(minutes) {

    game.timeChange += minutes;

}


function timeText(minutes) {

    if (minutes < 0)
        return `${minutes} minutes`;

    if (minutes > 0)
        return `+${minutes} minutes`;

    return "0 minutes";

}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    const app =
        document.getElementById("app");

    if (game.status === "finished") {

        renderResult(app);

        return;

    }

    app.innerHTML = `

        <header>

            <div>

                <div class="logo">
                    🏝️ Lost Island
                </div>

                <div class="subtitle">
                    Day ${game.day} ·
                    ${game.actionsToday} / 5 actions today ·
                    ${game.actionsUsed} total actions
                </div>

            </div>

            <div class="header-right">

                <button
                    class="header-button"
                    onclick="openSettings()">
                    ⚙️
                </button>

                <button
                    class="header-button"
                    onclick="confirmNewGame()">
                    ↻
                </button>

            </div>

        </header>


        ${renderStats()}

        ${renderResources()}

        ${renderLocations()}

        ${renderActions()}

    `;

}


function renderStats() {

    const healthPercent =
        Math.max(0, Math.min(100, game.health));

    return `

        <div class="card">

            <div class="stats">

                <div class="stat">

                    <div class="stat-value">
                        ❤️ ${game.health}
                    </div>

                    <div class="stat-label">
                        HEALTH
                    </div>

                    <div class="progress">
                        <div
                            class="progress-bar"
                            style="width:${healthPercent}%">
                        </div>
                    </div>

                </div>

                <div class="stat">

                    <div class="stat-value">
                        🍖 ${game.food}
                    </div>

                    <div class="stat-label">
                        FOOD
                    </div>

                </div>

                <div class="stat">

                    <div class="stat-value">
                        💧 ${game.water}
                    </div>

                    <div class="stat-label">
                        WATER
                    </div>

                </div>

            </div>

        </div>

    `;

}


function renderResources() {

    return `

        <div class="card">

            <h3>🎒 Supplies</h3>

            <div class="resources">

                <div class="resource">
                    <div class="resource-title">🪵 Wood</div>
                    <div class="resource-value">
                        ${game.wood}
                    </div>
                </div>

                <div class="resource">
                    <div class="resource-title">🧱 Materials</div>
                    <div class="resource-value">
                        ${game.materials}
                    </div>
                </div>

                <div class="resource">
                    <div class="resource-title">🏕️ Shelter</div>
                    <div class="resource-value">
                        ${game.shelter ? "Built" : "None"}
                    </div>
                </div>

                <div class="resource">
                    <div class="resource-title">🔥 Fire</div>
                    <div class="resource-value">
                        ${game.fire ? "Built" : "None"}
                    </div>
                </div>

                <div class="resource">
                    <div class="resource-title">📻 Radio</div>
                    <div class="resource-value">
                        ${game.radio ? "Found" : "None"}
                    </div>
                </div>

                <div class="resource">
                    <div class="resource-title">🔋 Battery</div>
                    <div class="resource-value">
                        ${game.battery ? "Found" : "None"}
                    </div>
                </div>

            </div>

        </div>

    `;

}


function renderLocations() {

    const locations = [];

    locations.push("🏖️ Beach");

    if (game.locations.jungle)
        locations.push("🌴 Jungle");

    if (game.locations.cave)
        locations.push("🕳️ Cave");

    if (game.locations.wreckage)
        locations.push("⚓ Wreckage");

    if (game.locations.radioTower)
        locations.push("📡 Radio Tower");

    if (game.locations.hiddenBeach)
        locations.push("🏝️ Hidden Beach");

    return `

        <div class="card">

            <h3>📍 Known locations</h3>

            ${locations.map(
                location =>
                    `<span class="location">${location}</span>`
            ).join("")}

        </div>

    `;

}


/* =========================================================
   ACTIONS
   ========================================================= */

function renderActions() {

    let actions = [];

    actions.push(action(
        "🌴",
        "Search for food",
        "Look for edible plants, fruit or fish.",
        "food"
    ));

    actions.push(action(
        "💧",
        "Find water",
        "Search for a freshwater source.",
        "water"
    ));

    actions.push(action(
        "🪵",
        "Gather wood",
        "Collect a useful amount of firewood.",
        "wood"
    ));

    actions.push(action(
        "🧱",
        "Gather materials",
        "Search for metal, rope and useful parts.",
        "materials"
    ));

    actions.push(action(
        "🗺️",
        "Explore",
        "Discover new areas and possible escape routes.",
        "explore"
    ));

    if (!game.shelter && game.wood >= 8) {

        actions.push(action(
            "🏕️",
            "Build shelter",
            "Requires 8 wood.",
            "shelter"
        ));

    }

    if (!game.fire &&
        game.wood >= 5 &&
        game.materials >= 2) {

        actions.push(action(
            "🔥",
            "Build fire",
            "Requires 5 wood and 2 materials.",
            "fire"
        ));

    }

    if (game.locations.cave) {

        actions.push(action(
            "🕳️",
            "Explore cave",
            "Search the cave for supplies.",
            "cave"
        ));

    }

    if (game.locations.wreckage) {

        actions.push(action(
            "⚓",
            "Search wreckage",
            "Search the wreck for survival equipment.",
            "wreckage"
        ));

    }

    if (
        game.radio &&
        game.battery &&
        !game.radioRepaired &&
        game.materials >= 3
    ) {

        actions.push(action(
            "🔧",
            "Repair radio",
            "Requires radio, battery and 3 materials.",
            "repairRadio"
        ));

    }

    if (
        game.locations.radioTower &&
        game.radioRepaired
    ) {

        actions.push(action(
            "📡",
            "Climb radio tower",
            "Attempt to transmit a distress signal.",
            "radioTower"
        ));

    }

    if (
        game.boat &&
        game.materials >= 3
    ) {

        actions.push(action(
            "🛶",
            "Repair boat",
            "Requires 3 materials.",
            "repairBoat"
        ));

    }

    if (
        game.boatRepaired
    ) {

        actions.push(action(
            "🌊",
            "Escape by sea",
            "Attempt to leave the island.",
            "boatEscape"
        ));

    }

    return `

        <div class="card">

            <h3>
                What will you do?
            </h3>

            <p class="small">
                You have
                <strong>
                    ${5 - game.actionsToday}
                </strong>
                actions remaining today.
            </p>

            <div class="action-list">

                ${actions.join("")}

            </div>

        </div>

    `;

}


function action(
    icon,
    title,
    description,
    type
) {

    const disabled =
        game.actionsToday >= 5;

    return `

        <button
            class="action"
            onclick="performAction('${type}')"
            ${disabled ? "disabled" : ""}>

            <div class="action-title">
                ${icon} ${title}
            </div>

            <div class="action-description">
                ${description}
            </div>

        </button>

    `;

}


/* =========================================================
   ACTION EXECUTION
   ========================================================= */

function performAction(type) {

    if (game.status !== "playing")
        return;

    if (game.actionsToday >= 5)
        return;

    game.actionsToday++;
    game.actionsUsed++;

    switch (type) {

        case "food":
            findFood();
            break;

        case "water":
            findWater();
            break;

        case "wood":
            gatherWood();
            break;

        case "materials":
            gatherMaterials();
            break;

        case "explore":
            explore();
            break;

        case "shelter":
            buildShelter();
            break;

        case "fire":
            buildFire();
            break;

        case "cave":
            cave();
            break;

        case "wreckage":
            wreckage();
            break;

        case "repairRadio":
            repairRadio();
            break;

        case "radioTower":
            radioTower();
            break;

        case "repairBoat":
            repairBoat();
            break;

        case "boatEscape":
            boatEscape();
            break;

    }

    if (game.health <= 0) {

        finish("death");

        return;

    }

    saveGame();

    render();

    if (game.actionsToday >= 5) {

        setTimeout(endDay, 350);

    }

}


/* =========================================================
   FOOD
   ========================================================= */

function findFood() {

    const roll = Math.random();

    if (roll < .50) {

        game.food += 3;

        notice(
            "🥥 Food found",
            "You discover several edible coconuts and fruit.",
            "🍖 Food +3"
        );

    }

    else if (roll < .78) {

        game.food += 2;

        notice(
            "🍓 Good find",
            "You find a useful amount of edible plants.",
            "🍖 Food +2"
        );

    }

    else if (roll < .88) {

        game.food += 5;

        addTime(game.settings.luckySmall);

        notice(
            "🎁 Lucky discovery",
            "You discover an abandoned emergency food cache.",
            `🍖 Food +5 · ${timeText(game.settings.luckySmall)}`
        );

    }

    else if (roll < .96) {

        game.food += 1;

        notice(
            "🌴 Small find",
            "You find a little food.",
            "🍖 Food +1"
        );

    }

    else {

        game.health -= 10;

        notice(
            "🐍 Bad luck",
            "Something bites you while searching.",
            "❤️ Health -10"
        );

    }

}


/* =========================================================
   WATER
   ========================================================= */

function findWater() {

    const roll = Math.random();

    if (game.freshWater) {

        game.water += 4;

        notice(
            "💧 Freshwater source",
            "You return to the freshwater source.",
            "💧 Water +4"
        );

        return;
    }

    if (roll < .50) {

        game.water += 3;

        game.freshWater = true;

        notice(
            "💧 Fresh water!",
            "You discover a small freshwater stream.",
            "💧 Water +3 · Permanent source discovered"
        );

    }

    else if (roll < .80) {

        game.water += 2;

        notice(
            "🥥 Coconut water",
            "You find several coconuts containing fresh water.",
            "💧 Water +2"
        );

    }

    else if (roll < .92) {

        game.water += 1;

        notice(
            "💧 Small water source",
            "You manage to collect a little water.",
            "💧 Water +1"
        );

    }

    else {

        game.health -= 8;

        notice(
            "⚠️ Contaminated water",
            "The water makes you sick.",
            "❤️ Health -8"
        );

    }

}


/* =========================================================
   WOOD
   ========================================================= */

function gatherWood() {

    const roll = Math.random();

    if (roll < .55) {

        game.wood += 4;

        notice(
            "🪵 Good haul",
            "You find a large amount of usable wood.",
            "🪵 Wood +4"
        );

    }

    else if (roll < .82) {

        game.wood += 3;

        notice(
            "🪵 Useful wood",
            "You collect several good branches.",
            "🪵 Wood +3"
        );

    }

    else if (roll < .94) {

        game.wood += 6;

        addTime(game.settings.luckySmall);

        notice(
            "🎁 Excellent find",
            "You discover a fallen tree with perfectly dry timber.",
            `🪵 Wood +6 · ${timeText(game.settings.luckySmall)}`
        );

    }

    else {

        game.wood += 1;

        game.health -= 5;

        notice(
            "💥 Accident",
            "A branch snaps and injures you.",
            "🪵 Wood +1 · ❤️ Health -5"
        );

    }

}


/* =========================================================
   MATERIALS
   ========================================================= */

function gatherMaterials() {

    const roll = Math.random();

    if (roll < .50) {

        game.materials += 3;

        notice(
            "🧱 Useful materials",
            "You recover metal, rope and other useful parts.",
            "🧱 Materials +3"
        );

    }

    else if (roll < .80) {

        game.materials += 2;

        notice(
            "🧱 Materials found",
            "You collect useful materials.",
            "🧱 Materials +2"
        );

    }

    else if (roll < .94) {

        game.materials += 5;

        addTime(game.settings.luckyLarge);

        notice(
            "🎁 Exceptional find",
            "You discover an old emergency equipment cache.",
            `🧱 Materials +5 · ${timeText(game.settings.luckyLarge)}`
        );

    }

    else {

        game.materials += 1;

        game.health -= 5;

        notice(
            "⚠️ Difficult terrain",
            "You hurt yourself while collecting materials.",
            "🧱 Materials +1 · ❤️ Health -5"
        );

    }

}


/* =========================================================
   EXPLORATION
   ========================================================= */

function explore() {

    const roll = Math.random();

    if (!game.locations.jungle) {

        game.locations.jungle = true;

        notice(
            "🌴 Jungle discovered",
            "You discover a dense jungle beyond the beach.",
            "New location discovered"
        );

        return;
    }

    if (
        !game.locations.cave &&
        roll < .50
    ) {

        game.locations.cave = true;

        notice(
            "🕳️ Cave discovered",
            "A dark opening leads into the hillside.",
            "New location discovered"
        );

        return;
    }

    if (
        !game.locations.wreckage &&
        roll < .70
    ) {

        game.locations.wreckage = true;

        notice(
            "⚓ Shipwreck discovered",
            "You discover the remains of an old shipwreck.",
            "New location discovered"
        );

        return;
    }

    if (
        !game.locations.radioTower &&
        game.day >= 4 &&
        roll < .75
    ) {

        game.locations.radioTower = true;

        notice(
            "📡 Radio tower discovered",
            "High above the island you spot an abandoned radio tower.",
            "Possible escape route discovered"
        );

        return;
    }

    if (
        !game.locations.hiddenBeach &&
        game.day >= 5 &&
        roll < .80
    ) {

        game.locations.hiddenBeach = true;
        game.boat = true;

        notice(
            "🛶 Hidden boat",
            "You discover a damaged boat hidden along a remote beach.",
            "Possible escape route discovered"
        );

        return;
    }

    if (roll < .90) {

        game.materials += 2;

        notice(
            "🧭 Interesting discovery",
            "You find useful materials while exploring.",
            "🧱 Materials +2"
        );

    }

    else {

        game.health -= 12;

        addTime(game.settings.setbackSmall);

        notice(
            "⚠️ Exploration accident",
            "You slip on the rocks and injure yourself.",
            `❤️ Health -12 · ${timeText(game.settings.setbackSmall)}`
        );

    }

}


/* =========================================================
   SHELTER
   ========================================================= */

function buildShelter() {

    game.wood -= 8;

    game.shelter = true;

    notice(
        "🏕️ Shelter completed",
        "You build a sturdy shelter before nightfall.",
        "Shelter established"
    );

}


/* =========================================================
   FIRE
   ========================================================= */

function buildFire() {

    game.wood -= 5;
    game.materials -= 2;

    game.fire = true;

    notice(
        "🔥 Fire established",
        "You manage to build a reliable fire.",
        "Night survival improved"
    );

}


/* =========================================================
   CAVE
   ========================================================= */

function cave() {

    const roll = Math.random();

    if (!game.flags.caveCache && roll < .45) {

        game.flags.caveCache = true;

        game.battery = true;

        game.materials += 3;

        notice(
            "🔋 Hidden emergency cache",
            "Deep inside the cave you discover an old emergency battery and equipment.",
            "🔋 Battery found · 🧱 Materials +3"
        );

    }

    else if (roll < .70) {

        game.water += 3;

        notice(
            "💧 Underground pool",
            "You discover clean water underground.",
            "💧 Water +3"
        );

    }

    else if (roll < .85) {

        game.materials += 4;

        notice(
            "🧱 Valuable metal",
            "You recover useful metal from an old mining area.",
            "🧱 Materials +4"
        );

    }

    else {

        game.health -= 18;

        addTime(game.settings.setbackLarge);

        notice(
            "🪨 Cave collapse",
            "Rocks fall around you as part of the cave collapses.",
            `❤️ Health -18 · ${timeText(game.settings.setbackLarge)}`
        );

    }

}


/* =========================================================
   WRECKAGE
   ========================================================= */

function wreckage() {

    const roll = Math.random();

    if (!game.radio) {

        game.radio = true;

        notice(
            "📻 Emergency radio",
            "Behind the remains of the cockpit you discover a damaged emergency radio.",
            "📻 Radio found"
        );

        return;
    }

    if (!game.battery) {

        game.battery = true;

        notice(
            "🔋 Battery compartment",
            "You find an emergency battery hidden beneath the wreckage.",
            "🔋 Battery found"
        );

        return;
    }

    if (roll < .60) {

        game.materials += 4;

        notice(
            "⚙️ Useful parts",
            "You recover valuable components from the wreck.",
            "🧱 Materials +4"
        );

    }

    else if (roll < .85) {

        game.flags.ropeFound = true;

        game.materials += 2;

        notice(
            "🪢 Rope found",
            "A strong length of rope is still usable.",
            "🪢 Rope + 🧱 Materials +2"
        );

    }

    else {

        game.health -= 15;

        addTime(game.settings.setbackSmall);

        notice(
            "💥 Wreckage accident",
            "A piece of metal shifts and cuts you.",
            `❤️ Health -15 · ${timeText(game.settings.setbackSmall)}`
        );

    }

}


/* =========================================================
   RADIO
   ========================================================= */

function repairRadio() {

    game.materials -= 3;

    game.radioRepaired = true;

    addTime(game.settings.luckySmall);

    notice(
        "📻 RADIO REPAIRED",
        "After hours of work, the emergency radio comes alive.",
        `Radio operational · ${timeText(game.settings.luckySmall)}`
    );

}


/* =========================================================
   RADIO TOWER
   ========================================================= */

function radioTower() {

    if (Math.random() < .85) {

        finish("radio");

    }

    else {

        addTime(game.settings.setbackLarge);

        notice(
            "📡 Weak signal",
            "The tower works, but atmospheric conditions prevent a successful transmission.",
            `${timeText(game.settings.setbackLarge)}`
        );

    }

}


/* =========================================================
   BOAT
   ========================================================= */

function repairBoat() {

    game.materials -= 3;

    game.boatRepaired = true;

    notice(
        "🛶 Boat repaired",
        "The boat is barely seaworthy, but it might get you off the island.",
        "Escape route available"
    );

}


function boatEscape() {

    if (Math.random() < .80) {

        finish("boat");

    }

    else {

        game.health -= 25;

        addTime(game.settings.setbackLarge);

        notice(
            "🌊 Failed launch",
            "The boat takes on water before you can leave.",
            `❤️ Health -25 · ${timeText(game.settings.setbackLarge)}`
        );

    }

}


/* =========================================================
   NIGHT
   ========================================================= */

function endDay() {

    if (game.status !== "playing")
        return;

    let damage = 0;

    if (game.water > 0) {

        game.water--;

    } else {

        damage += 15;

    }

    if (game.food > 0) {

        game.food--;

    } else {

        damage += 10;

    }

    if (!game.shelter && Math.random() < .35) {

        damage += 10;

    }

    if (damage > 0) {

        game.health -= damage;

        showNightMessage(
            `🌙 Night ${game.day}`,
            `The night takes its toll.<br><br>
             ❤️ Health -${damage}`
        );

    }


    if (game.health <= 0) {

        finish("death");

        return;

    }


    if (game.day >= game.settings.maxDays) {

        finish("failure");

        return;

    }


    game.day++;

    game.actionsToday = 0;

    saveGame();

    render();

}


/* =========================================================
   NOTICES
   ========================================================= */

function notice(title, text, consequence) {

    const app =
        document.getElementById("app");

    app.innerHTML += `

        <div class="modal-background" id="noticeModal">

            <div class="modal">

                <div class="event">

                    <h2>${title}</h2>

                    <p>${text}</p>

                    <p>
                        <strong>
                            ${consequence}
                        </strong>
                    </p>

                </div>

                <button
                    class="primary"
                    onclick="closeNotice()">

                    Continue

                </button>

            </div>

        </div>

    `;

}


function closeNotice() {

    const modal =
        document.getElementById("noticeModal");

    if (modal)
        modal.remove();

    saveGame();

    render();

}


function showNightMessage(title, text) {

    const app =
        document.getElementById("app");

    app.innerHTML += `

        <div class="modal-background" id="nightModal">

            <div class="modal">

                <div class="event">

                    <h2>${title}</h2>

                    <p>${text}</p>

                </div>

                <button
                    class="primary"
                    onclick="continueNight()">

                    Continue

                </button>

            </div>

        </div>

    `;

}


function continueNight() {

    const modal =
        document.getElementById("nightModal");

    if (modal)
        modal.remove();

    game.day++;

    game.actionsToday = 0;

    saveGame();

    render();

}


/* =========================================================
   FINISH GAME
   ========================================================= */

function finish(route) {

    if (game.status === "finished")
        return;

    game.status = "finished";

    game.result = route;

    let change = 0;

    if (route === "death") {

        change = game.settings.deathPenalty;

    }

    else if (route === "failure") {

        change = game.settings.failurePenalty;

    }

    else {

        const a = game.actionsUsed;

        if (a <= game.settings.legendaryActions)
            change = game.settings.legendaryReward;

        else if (a <= game.settings.excellentActions)
            change = game.settings.excellentReward;

        else if (a <= game.settings.goodActions)
            change = game.settings.goodReward;

        else if (a <= game.settings.survivedActions)
            change = game.settings.survivedReward;

        else if (a <= game.settings.slowActions)
            change = game.settings.slowPenalty;

        else
            change = game.settings.criticalPenalty;

    }

    game.timeChange += change;

    saveGame();

    render();

}


/* =========================================================
   RESULT
   ========================================================= */

function renderResult(app) {

    let title = "";
    let description = "";
    let score = "";

    if (game.result === "radio") {

        title = "🚁 RESCUED BY RADIO";

        description =
            "Your distress signal was received. Rescue has arrived.";

    }

    else if (game.result === "boat") {

        title = "🛶 ESCAPED BY SEA";

        description =
            "Against the odds, you managed to repair the boat and escape.";

    }

    else if (game.result === "death") {

        title = "☠️ YOU DIED";

        description =
            "The island proved too much.";

    }

    else {

        title = "💀 THE ISLAND WON";

        description =
            "You reached the maximum survival period without finding a way off the island.";

    }


    if (game.result === "death" ||
        game.result === "failure") {

        score = "☠️ Failure";

    }

    else {

        const a = game.actionsUsed;

        if (a <= game.settings.legendaryActions)
            score = "🏆 LEGENDARY";

        else if (a <= game.settings.excellentActions)
            score = "🥇 EXCELLENT";

        else if (a <= game.settings.goodActions)
            score = "🥈 GOOD";

        else if (a <= game.settings.survivedActions)
            score = "🙂 SURVIVED";

        else if (a <= game.settings.slowActions)
            score = "⚠️ SLOW SURVIVAL";

        else
            score = "🔴 CRITICAL SURVIVAL";

    }


    app.innerHTML = `

        <div class="card result">

            <div class="event">

                <h2>${title}</h2>

                <p>
                    ${description}
                </p>

            </div>

            <div class="result-score">
                ${score}
            </div>

            <p>
                You used
                <strong>
                    ${game.actionsUsed}
                </strong>
                actions.
            </p>

            <hr>

            <div class="time-change">

                ${game.timeChange > 0 ? "+" : ""}
                ${game.timeChange} minutes

            </div>

            <p class="small">
                Total simulated Chastify time adjustment
            </p>

            <hr>

            <p>
                ❤️ Health: ${game.health}<br>
                🍖 Food: ${game.food}<br>
                💧 Water: ${game.water}<br>
                🪵 Wood: ${game.wood}<br>
                🧱 Materials: ${game.materials}
            </p>

            <button
                class="primary"
                onclick="newGame()">

                🏝️ Play Again

            </button>

        </div>

    `;

}


/* =========================================================
   SETTINGS
   ========================================================= */

function openSettings() {

    const s = game.settings;

    Object.keys(s).forEach(key => {

        const element =
            document.getElementById(key);

        if (element)
            element.value = s[key];

    });

    document
        .getElementById("settingsModal")
        .classList.remove("hidden");

}


function closeSettings() {

    document
        .getElementById("settingsModal")
        .classList.add("hidden");

}


function saveSettings() {

    const keys =
        Object.keys(DEFAULT_SETTINGS);

    keys.forEach(key => {

        const element =
            document.getElementById(key);

        if (element) {

            let value =
                Number(element.value);

            if (!Number.isFinite(value))
                value = DEFAULT_SETTINGS[key];

            game.settings[key] = value;

        }

    });

    saveGame();

    closeSettings();

    render();

}


/* =========================================================
   NEW GAME
   ========================================================= */

function confirmNewGame() {

    if (
        confirm(
            "Start a new game? Your current progress will be lost."
        )
    ) {

        newGame();

    }

}


function newGame() {

    game = createNewGame();

    saveGame();

    render();

}


/* =========================================================
   START
   ========================================================= */

loadGame();

render();

</script>
